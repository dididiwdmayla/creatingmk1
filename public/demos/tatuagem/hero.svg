<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Placeholder: estúdio de tatuagem">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="0.55" stop-color="#0D0D0D"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#8B0000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B0000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#F5F5F5" opacity="0.04"/>
      <circle cx="16" cy="18" r="1" fill="#F5F5F5" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grain)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- moldura editorial -->
  <rect x="64" y="64" width="1472" height="872" fill="none" stroke="#8B0000" stroke-opacity="0.3" stroke-width="2"/>
  <rect x="84" y="84" width="1432" height="832" fill="none" stroke="#F5F5F5" stroke-opacity="0.06" stroke-width="1"/>

  <!-- máquina de tatuagem estilizada -->
  <g transform="translate(800 470)" stroke="#F5F5F5" stroke-opacity="0.5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-30" y="-160" width="60" height="150" rx="10" stroke="#8B0000" stroke-opacity="0.55"/>
    <line x1="0" y1="-10" x2="0" y2="120" stroke-width="6"/>
    <circle cx="0" cy="140" r="10" fill="#8B0000" stroke="none" opacity="0.85"/>
    <line x1="-70" y1="-40" x2="-30" y2="-70" />
    <line x1="70" y1="-40" x2="30" y2="-70" />
    <circle cx="-84" cy="-30" r="14" />
    <circle cx="84" cy="-30" r="14" />
  </g>

  <!-- rosa e adaga cruzadas (motivo flash tradicional) -->
  <g transform="translate(800 470)" stroke="#8B0000" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M-260 90 Q -230 20 -260 -40 Q -290 20 -260 90 Z"/>
    <circle cx="-260" cy="10" r="46"/>
    <path d="M260 90 L 260 -120 M 240 -100 L 280 -100"/>
  </g>

  <g font-family="Georgia, serif" text-anchor="middle" fill="#8A8A8A">
    <text x="800" y="860" font-size="24" letter-spacing="16">TATUAGEM</text>
    <line x1="660" y1="886" x2="940" y2="886" stroke="#8B0000" stroke-opacity="0.5" stroke-width="1"/>
  </g>
</svg>
