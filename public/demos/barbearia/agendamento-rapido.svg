<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Placeholder: cliente sendo atendido na cadeira">
  <defs>
    <linearGradient id="qb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D3025"/>
      <stop offset="1" stop-color="#1E1712"/>
    </linearGradient>
    <radialGradient id="qbg" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#B8862D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B8862D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="700" fill="url(#qb)"/>
  <rect width="900" height="700" fill="url(#qbg)"/>
  <rect x="40" y="40" width="820" height="620" fill="none" stroke="#B8862D" stroke-opacity="0.3" stroke-width="2"/>

  <!-- cadeira de barbeiro estilizada -->
  <g transform="translate(450 430)">
    <rect x="-160" y="-40" width="320" height="30" rx="8" fill="#B8862D" opacity="0.25"/>
    <rect x="-140" y="-190" width="280" height="150" rx="16" fill="#B8862D" opacity="0.3"/>
    <rect x="-30" y="10" width="60" height="120" fill="#0E0A07"/>
    <ellipse cx="0" cy="140" rx="130" ry="18" fill="#0E0A07" opacity="0.6"/>
    <rect x="-110" y="120" width="34" height="20" rx="6" fill="#B8862D" opacity="0.4"/>
    <rect x="76" y="120" width="34" height="20" rx="6" fill="#B8862D" opacity="0.4"/>
  </g>

  <!-- silhueta do cliente sentado -->
  <g transform="translate(440 300)" fill="#0C0906">
    <circle cx="0" cy="0" r="58"/>
    <path d="M-90 220 Q -90 60 0 60 Q 90 60 90 220 Z"/>
  </g>

  <!-- silhueta do barbeiro em pé, tesoura na mão -->
  <g transform="translate(610 250)" fill="#140F0A">
    <circle cx="0" cy="-10" r="42"/>
    <path d="M-60 250 Q -70 40 0 40 Q 70 40 60 250 Z"/>
  </g>
  <g transform="translate(560 220) rotate(-20)" stroke="#B8862D" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="-30" y1="-10" x2="20" y2="14"/>
    <line x1="30" y1="-10" x2="-20" y2="14"/>
    <circle cx="24" cy="18" r="8"/>
    <circle cx="-24" cy="18" r="8"/>
  </g>

  <text x="450" y="640" font-family="Georgia, serif" font-size="22" letter-spacing="10" text-anchor="middle" fill="#A89882">ATENDIMENTO SEM PRESSA</text>
</svg>
